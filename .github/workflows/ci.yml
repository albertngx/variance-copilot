# CI pipeline (SPEC §27). Later epics add generator, eval, contract, Docker and CDK steps.
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m "unit or property" --cov --cov-report=term --cov-report=json
      - run: uv run python scripts/coverage_gate.py

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: vc_test
          POSTGRES_PASSWORD: vc_test
          POSTGRES_DB: vc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vc_test -d vc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VC_TEST_DATABASE_URL: postgresql://vc_test:vc_test@localhost:5432/vc_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m "not unit and not property"
      - name: Generate the ci profile and run V-01..V-10
        env:
          VC_DATABASE_URL: postgresql+psycopg://vc_test:vc_test@localhost:5432/vc_test
        run: |
          uv run vc db migrate
          uv run vc seed --profile ci --seed 20261010

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-emit-project --all-groups -q -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --disable-pip --progress-spinner off
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --verbose
